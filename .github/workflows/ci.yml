name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download test database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/app
          gh release download data-v1 \
            --pattern "context.duckdb.gz" \
            --dir /tmp
          gzip -dc /tmp/context.duckdb.gz \
            > data/app/context.duckdb

      - name: Run tests
        run: python -m pytest -q

      - name: Check JavaScript
        run: |
          node --check app/static/app.js
          node --check app/static/search.js
