services:
  - type: web
    name: nbacontext
    runtime: python
    plan: free
    region: virginia
    buildCommand: python -m pip install -r requirements.txt && python scripts/download_database.py
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/meta
    envVars:
      - key: CONTEXT_DB_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
